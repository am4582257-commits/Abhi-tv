name: Build ABHI TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ABHI_SIGNING_CONFIGURED: ${{ secrets.ABHI_TV_KEYSTORE_BASE64 != '' && secrets.ABHI_TV_KEYSTORE_PASSWORD != '' && secrets.ABHI_TV_KEY_ALIAS != '' && secrets.ABHI_TV_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Build APK
        run: gradle --stop || true
      - name: Clean and build APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      # Keep the signing key and passwords in Actions secrets only.
      - name: Sign APK with permanent release key
        if: ${{ env.ABHI_SIGNING_CONFIGURED == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ABHI_TV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ABHI_TV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ABHI_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ABHI_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          KS="$RUNNER_TEMP/abhi-tv-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          KS_BYTES="$(wc -c < "$KS" | tr -d ' ')"
          echo "Decoded keystore size: ${KS_BYTES} bytes"
          if [ "$KS_BYTES" -lt 1000 ]; then
            echo "::error::Decoded keystore is unexpectedly small. Re-save the complete ABHI_TV_KEYSTORE_BASE64 secret from the local Base64 file."
            exit 1
          fi
          # Validate the decoded file, store password, and alias before signing.
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/abhi-tv-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/abhi-tv-signed.apk" \
            "$RUNNER_TEMP/abhi-tv-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/abhi-tv-signed.apk"
          mv "$RUNNER_TEMP/abhi-tv-signed.apk" "$APK"
          rm -f "$KS" "$RUNNER_TEMP/abhi-tv-aligned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABHI-TV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
